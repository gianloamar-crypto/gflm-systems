<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f0c">
  <meta name="description" content="GFLM Systems: panel de administración de obra, requerimientos, compras, caja, almacén y personal.">
  <title>GFLM Systems · Field Operations</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./operations.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegación">
      <div class="brand"><div class="brand-mark">G</div><div><b>GFLM <span>SYSTEMS</span></b><small>Gestión integral de obra</small></div></div>
      <div class="sidebar-label">ESPACIO DE TRABAJO</div>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom">
        <div class="local-pill"><span class="signal"></span> Modo local de pruebas</div>
        <p>Los datos se guardan solamente en este navegador, no en la nube.</p>
        <button class="side-backup" type="button" id="sideBackup">↓ Exportar respaldo</button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="heading-left"><button id="menuToggle" class="icon-btn menu-toggle" aria-label="Abrir menú">☰</button><div class="breadcrumb">GFLM Systems <span>/</span> <strong id="crumb">Resumen general</strong></div></div>
        <div class="top-actions"><span class="top-tag">Versión web piloto</span><button type="button" class="btn btn-muted" id="importBtn">↑ Importar</button><button type="button" class="btn btn-primary" id="addBtn">＋ Nuevo registro</button></div>
      </header>
      <main class="main">
        <div id="view"></div>
      </main>
    </div>
  </div>
  <div class="modal-layer hidden" id="modalLayer" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><div class="eyebrow">GFLM SYSTEMS</div><h2 id="modalTitle">Nuevo registro</h2></div><button type="button" class="icon-btn" id="closeModal" aria-label="Cerrar">✕</button></div><form id="recordForm"><div class="form-grid" id="formGrid"></div><div class="modal-footer"><button type="button" class="btn btn-muted" id="cancelModal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar registro</button></div></form></div></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <div class="toast hidden" id="toast"></div>
  <script src="./main.js" defer></script>
  <script src="./operations.js" defer></script>
</body>
</html>
