/* Cierre rápido y análisis sencillo (Intelligence V2) */

.quick-panel{max-width:880px}.quick-panel .fields{gap:11px 16px}.quick-panel label{font-size:13px}.quick-panel input,.quick-panel select{min-height:45px}.quick-panel .charttitle{margin-bottom:15px}

.debt-card{background:#FFFCF8;border:1px solid #E6D8CA;border-radius:14px;margin-bottom:15px;padding:17px}

/* Mi Ruta PRO | Edición cálida y profesional — únicamente presentación */
:root{
  color-scheme:light;
  --page:#F8F5F0;--paper:#FFFEFB;--ink:#332E29;--muted:#756B62;
  --border:#E5DBD0;--accent:#A95D45;--accent-dark:#87432F;
  --accent-soft:#F4E6DB;--sage:#48745D;--risk:#AD6258;
}
html{scroll-behavior:smooth}
body{background:var(--page);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.sidebar{background:linear-gradient(180deg,#F4EEE6 0%,#F0E9E0 100%);border-color:var(--border)}
.brand{color:#302B27;letter-spacing:-.7px}
.brand b{color:var(--accent)}
.menu{color:#655B52;font-weight:590;transition:background .16s,color .16s}
.menu.active{background:#E9D7C8;color:#8A4934;font-weight:750}
.menu:hover:not(.active){background:#EDE3D9;color:#4F433B}
.main{max-width:1380px}
.top{padding-bottom:7px}
.top h1{color:#302B27;font-weight:790;letter-spacing:-.65px}
.muted,.help{color:var(--muted)}
.card,.panel,.auth,.debt-card{
  background:var(--paper);
  border:1px solid var(--border);
  box-shadow:0 3px 16px rgba(65,43,30,.045);
}
.card{transition:transform .16s,box-shadow .16s,border-color .16s}
.card:hover{border-color:#DCC7B6;box-shadow:0 7px 23px rgba(65,43,30,.07)}
.card small,.debt-stats small{color:#74695F}
.card strong{color:#322D27;font-variant-numeric:tabular-nums}
.panel h2{color:#302A26;letter-spacing:-.2px}
.welcome{
  background:linear-gradient(115deg,#F1E3D5 0%,#FAF3EA 73%,#FFF8F0 100%);
  border:1px solid #E4D0BF;
  box-shadow:0 7px 25px rgba(114,75,53,.07);
}
.welcome h2{color:#332A25}
.welcome p{color:#6D6055}
.eyebrow{color:#A65C44!important}
.btn{
  background:var(--accent);
  color:#FFFDF9;
  font-weight:740;
  box-shadow:0 3px 9px rgba(169,93,69,.12);
  transition:background .16s,transform .14s,box-shadow .16s;
}
.btn:hover{background:var(--accent-dark);box-shadow:0 5px 13px rgba(169,93,69,.17)}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:#EEE5DA;color:#574A40;box-shadow:none}
.btn.secondary:hover{background:#E5D7CA}
.btn.danger{background:#F5E5E1;color:#9B493F;box-shadow:none}
.btn.danger:hover{background:#F1D8D3}
input,select,textarea{
  background:#FFFEFB;border:1px solid #D9CEC3;border-radius:10px;
  color:#352D27;outline:none;box-shadow:none;
  transition:border-color .16s,box-shadow .16s;
}
input::placeholder,textarea::placeholder{color:#9E958B}
input:focus,select:focus,textarea:focus{
  border-color:#AD806B;box-shadow:0 0 0 3px rgba(169,93,69,.14);
}
button:focus-visible,.menu:focus-visible,.extras summary:focus-visible{
  outline:3px solid #BA8971;outline-offset:2px
}
label{color:#695F55;font-weight:630}
th{background:#F9F5EF;color:#675C52}
td,th{border-color:#ECE4DC}
tbody tr:hover{background:#FCF7F1}
.green{color:#46725B}.red{color:#A9534B}
.bar{background:linear-gradient(180deg,#CB9479,#B36A50)}
.bar.neg{background:#BD7770}
.barlabel{color:#6D6259}
.barvalue{color:#5F554C;font-weight:650}
.notice{background:#FFF5E7;border-color:#E9D6BC;color:#6D5134}
.tag{background:#F2E4D8;color:#95563F;font-weight:700}
.auth{box-shadow:0 12px 35px rgba(70,48,34,.08)}
.auth .brand{padding-bottom:8px}
.extras{background:#FCF8F3;border-color:#E4D9CE}
.extras>summary{color:#5C4D42}
.live-preview{background:#FAF3E9;border-color:#CEB49D;color:#584A3F}
.quick-total{background:#F3E5D9;border:1px solid #EAD5C4}
.quick-total strong{color:#92543D}
.insight{background:#F9F1E8;border-left-color:#AE6B50;color:#50443B}
.sep{border-color:#E6DED5}
.debt-stats>div{background:#FAF5EF;border-color:#E8DED3}
.debt-action{background:#FBF6F0;border-color:#E7D8CB}
.debt-history summary{color:#89533E}
.debt-progress{background:#E9DDD1}
.debt-progress span{background:#AE7459}
.checkbox-option{color:#51483F}
.foot{color:#8C8177}
@media(max-width:690px){
 .sidebar{background:#F4ECE3;border-bottom:1px solid #E5DBD0;box-shadow:0 4px 14px rgba(58,43,31,.045)}
 .main{padding:20px 13px}
 .top h1{font-size:23px}
 .card:hover{transform:none}
 .welcome{padding:18px}
}

/* Alta real y punto de partida del conductor */
.auth-refresh{margin:6vh auto;max-width:475px}
.auth-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.auth-controls .btn{min-height:47px}
.auth-footnote{font-size:12px;color:#7B6D60;margin-top:24px}
.step-indicator{letter-spacing:1.7px;text-transform:uppercase;font-size:11px;font-weight:800;color:#9F654B}
.setup-page{min-height:100vh;padding:36px 16px 60px;background:radial-gradient(circle at top right,#F6E7D9 0%,#F8F5F0 45%,#F5EFE6 100%)}
.setup-shell{max-width:840px;margin:auto;background:#FFFEFB;border:1px solid #E7DBD0;border-radius:23px;padding:26px 34px;box-shadow:0 13px 45px rgba(74,52,34,.075)}
.setup-header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.setup-header .brand{padding:0}
.setup-shell h1{font-size:29px;letter-spacing:-.8px;margin:9px 0}
.setup-shell .muted{font-size:14px;max-width:640px}
.setup-steps{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0;padding-bottom:17px;border-bottom:1px solid #EDE2D7}
.setup-steps>div{display:flex;align-items:center;gap:8px;background:#F6F0E9;border-radius:100px;padding:7px 12px;color:#70645A;font-size:12px}
.setup-steps>div strong{display:grid;place-items:center;background:#E7D8C8;color:#6B5242;width:22px;height:22px;border-radius:100px}
.setup-steps>div.current{color:#85452F;background:#F4E2D5;font-weight:700}
.setup-steps>div.current strong{background:#AD6850;color:white}
.setup-fields{gap:10px 16px}
.setup-heading{font-weight:800;color:#59483D;letter-spacing:-.2px;padding:13px 0 4px;border-bottom:1px solid #F0E5D9}
.setup-fields label{font-size:13px;margin:4px 0 6px}
.setup-fields input{min-height:44px}
.setup-fields .help{margin:7px 0 0}
.setup-submit{width:100%;margin-top:20px;min-height:52px}
.setup-note{margin-top:20px;background:#F8F1EA;border-radius:12px;color:#6D5E51;padding:13px 16px;font-size:12px}
.starting-cards .card strong{font-size:20px}
@media(max-width:690px){
 .setup-page{padding:10px 8px 32px}
 .setup-shell{padding:20px 16px;border-radius:16px}
 .setup-shell h1{font-size:24px}
 .setup-steps{gap:5px}
 .setup-steps>div{padding:5px 8px;font-size:10px}
 .setup-steps>div strong{width:19px;height:19px}
 .auth-controls{grid-template-columns:1fr}
 .starting-cards .card strong{font-size:16px}
}

/* Panel privado de propietario y estados de suscripción */
.admin-hero{align-items:center}
.admin-stats{grid-template-columns:repeat(5,minmax(0,1fr))}
.customer-line{padding:17px 0;border-bottom:1px solid #e8ded2}
.customer-line:last-child{border-bottom:0}
.customer-identity{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.customer-identity strong{color:#413329;overflow-wrap:anywhere}
.customer-identity small{color:#796b60}
.account-status{background:#f1e1d6;border:1px solid #e6c9b8;color:#8a4c35;padding:4px 9px;border-radius:100px;font-size:11px;font-weight:700}
.customer-controls{display:grid;grid-template-columns:minmax(120px,1fr) minmax(145px,1fr) minmax(150px,1fr) auto;gap:10px;align-items:end}
.customer-controls>div label{margin:0 0 5px}
.customer-controls select,.customer-controls input{height:43px}
.customer-controls button{min-height:43px}
.customer-quick{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
.customer-feedback{margin-left:8px}
@media(max-width:1000px){.admin-stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:690px){.admin-stats{grid-template-columns:repeat(2,1fr)}.customer-controls{grid-template-columns:1fr 1fr}.customer-controls button{grid-column:1/-1}.admin-hero{flex-direction:column;align-items:stretch}}

/* Exclusive owner provisioning */
.create-client-panel{background:#FFFDF9;border-color:#D6BDAA}
.create-client-panel .fields{margin-top:12px;gap:12px 16px}
.create-client-panel .btn.big{width:100%}
.credentials-once{margin-top:17px;padding:18px;border-radius:13px;background:#F3E7D9;border:1px solid #D7AC91;color:#4D3428}
.credentials-once code{padding:7px 10px;display:inline-block;background:#FFFEFB;border:1px solid #DEC6B4;border-radius:7px;color:#7D4431;user-select:all;overflow-wrap:anywhere}
.customer-quick [data-password-reset]{margin-left:5px}
@media(max-width:690px){.create-client-panel .fields{grid-template-columns:1fr}.customer-quick [data-password-reset]{margin-left:0}}


/* V8 · Panel de uso comercial con la paleta cálida de Mi Ruta PRO */
.usage-overview{border-color:#DFCBBB;background:#FFFCF8}
.usage-overview .charttitle{align-items:flex-start;flex-wrap:wrap}
.usage-overview .charttitle>.actions{align-items:center}
.usage-overview select{width:auto;min-width:110px}
.usage-cards{grid-template-columns:repeat(4,minmax(0,1fr))}
.usage-cards .card{background:#FAF4EE}
.live-dot{display:inline-flex;align-items:center;gap:5px;border-radius:100px;font-size:11px;font-weight:700;padding:5px 9px}
.live-dot.online{color:#376D50;background:#EAF4EC;border:1px solid #C8DFC9}
.live-dot.offline{color:#7D7369;background:#F1ECE5;border:1px solid #E6DCD0}
.client-usage{margin-top:15px;padding:14px;border-radius:13px;border:1px solid #E8D8C8;background:#FFFCF8;min-width:0}
.client-usage>summary{cursor:pointer;color:#7E4A36;font-weight:750;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.client-usage>summary .help{font-weight:500}
.client-usage[open]>summary{padding-bottom:15px}
.client-usage h3{font-size:13px;margin:19px 0 8px;color:#594D43}
.client-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.client-metric{background:#F7F0E8;padding:11px;border-radius:10px;min-width:0}
.client-metric small{display:block;font-size:11px;color:#75695F;margin-bottom:6px}
.client-metric strong{font-size:16px;color:#4C4138;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.activity-chart{height:158px;display:flex;align-items:end;gap:12px;padding:12px 8px 0;border-bottom:1px solid #EADDD0}
.activity-column{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;gap:5px;min-width:0}
.activity-bar-track{width:100%;max-width:46px;height:110px;border-radius:7px 7px 0 0;display:flex;align-items:flex-end;background:#F2E6DB;overflow:hidden}
.activity-bar{width:100%;border-radius:7px 7px 0 0;background:linear-gradient(180deg,#C18C70,#A96147);min-height:0;transition:height .2s ease}
.activity-value,.activity-day{font-size:11px;color:#76685E}
.module-usage{display:flex;flex-wrap:wrap;gap:7px}
@media(max-width:1050px){.client-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:690px){
 .usage-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
 .usage-overview .charttitle>.actions{width:100%;flex-wrap:wrap}
 .usage-overview .charttitle>.actions button{flex:1}
 .client-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
 .activity-chart{gap:6px}
 .client-usage{padding:12px}
 .customer-identity{gap:6px}
 .client-usage>summary .help{font-size:11px}
}
