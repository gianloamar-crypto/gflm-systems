<!doctype html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#0d2018"/><meta name="description" content="Mi Ruta PRO - Control del conductor"/><link rel="manifest" href="manifest.webmanifest"/><title>Mi Ruta PRO | Tu control, tu ganancia</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf5ed;background:#091610}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}input,select,textarea{background:#10251a;border:1px solid #31503e;border-radius:10px;color:#eef9f1;padding:11px;width:100%}label{display:block;font-size:12px;color:#b2c7ba;margin:10px 0 5px}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.sidebar{background:#0b1c13;border-right:1px solid #244333;padding:23px 14px;position:sticky;top:0;height:100vh}.brand{font-size:23px;font-weight:850;letter-spacing:-.8px;padding:8px 10px 23px}.brand b{color:#6fe3a0}.menu{display:flex;align-items:center;gap:10px;padding:12px 13px;width:100%;border:0;text-align:left;background:transparent;color:#b6cebf;border-radius:11px;margin:2px 0}.menu.active,.menu:hover{background:#1e422d;color:#a0ffbc}.main{padding:27px 35px;max-width:1450px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px;flex-wrap:wrap}.top h1{margin:0;font-size:27px}.muted{color:#97b3a2;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:22px 0}.card,.panel{background:#102319;border:1px solid #254435;border-radius:17px;padding:19px}.card small{color:#acc4b3}.card strong{display:block;font-size:24px;margin-top:10px}.green{color:#8df0ae}.red{color:#ff9f9f}.split{display:grid;grid-template-columns:1.5fr 1fr;gap:17px}.panel{margin-bottom:18px}.panel h2{margin:0 0 16px;font-size:17px}.btn{border:0;background:#58d68b;color:#062013;font-weight:750;border-radius:11px;padding:11px 15px}.btn.secondary{background:#274332;color:#e3ffeb}.btn.danger{background:#56302b;color:#ffd6d6}.actions{display:flex;gap:8px;flex-wrap:wrap}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 14px}.fields .wide{grid-column:1/-1}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px 7px;border-bottom:1px solid #294437}th{color:#acc8b6;font-weight:650}.scroll{overflow-x:auto}.bars{display:flex;gap:9px;align-items:end;height:220px;padding:15px 6px 0}.barwrap{flex:1;min-width:24px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:8px}.bar{width:70%;border-radius:7px 7px 2px 2px;background:#56d488;min-height:2px}.bar.neg{background:#e98181}.barlabel{font-size:12px;color:#b5cdbb}.barvalue{font-size:10px;color:#d0ecda}.auth{max-width:440px;margin:8vh auto;padding:26px;border:1px solid #2d503c;background:#102319;border-radius:19px}.auth h1{margin:8px 0}.notice{border:1px solid #4d6444;border-radius:11px;background:#24321d;color:#e0e9c8;padding:12px;margin-bottom:15px;font-size:13px}.help{font-size:12px;color:#aec4b6}.tag{font-size:11px;background:#254f33;color:#a4edb6;border-radius:8px;padding:5px 9px}.hidden{display:none!important}.charttitle{display:flex;justify-content:space-between;gap:10px;align-items:center}.foot{padding:25px;text-align:center;color:#829b8b;font-size:12px}.empty{padding:30px;color:#8ba796;text-align:center} @media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.main{padding:20px}}@media(max-width:690px){.layout{display:block}.sidebar{position:sticky;z-index:5;height:auto;display:flex;padding:5px 9px;overflow:auto;gap:6px}.brand{font-size:17px;white-space:nowrap;padding:14px 7px}.menu{white-space:nowrap;width:auto;font-size:12px;padding:10px}.main{padding:19px 13px}.cards{gap:8px}.card{padding:13px}.card strong{font-size:19px}.fields{grid-template-columns:1fr}}

/* Cierre rápido y análisis sencillo (Intelligence V2) */
.welcome{display:flex;justify-content:space-between;gap:18px;align-items:center;background:linear-gradient(120deg,#173b27,#14241b);border:1px solid #3d7455;padding:25px 27px}
.welcome h2{font-size:22px;margin:5px 0 8px}.welcome p{margin:0;color:#c4e0cc}.eyebrow{letter-spacing:2px;font-size:11px;font-weight:800;color:#88d9a3!important}.btn.big{padding:14px 20px;font-size:16px;white-space:nowrap}
.quick-panel{max-width:880px}.quick-panel .fields{gap:11px 16px}.quick-panel label{font-size:13px}.quick-panel input,.quick-panel select{min-height:45px}.quick-panel .charttitle{margin-bottom:15px}
.extras{border:1px solid #315940;border-radius:11px;background:#10251a;padding:14px}.extras>summary{cursor:pointer;font-weight:700;color:#d3eddb;list-style:none}.extras>summary::-webkit-details-marker{display:none}.extras[open]>summary{margin-bottom:15px}.extras .fields{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 15px}
.live-preview{padding:11px;border:1px dashed #50865e;border-radius:9px;color:#bfe5cd;background:#153222;font-size:13px}.quick-total{padding:18px;background:#224a31;border-radius:13px;display:flex;justify-content:space-between;align-items:center;gap:12px}.quick-total strong{color:#8afaaf;font-size:25px}.submit-day{width:100%}.insight{background:#1a3928;border-left:3px solid #61d998;padding:13px;border-radius:7px;font-size:14px}.sep{border:0;border-top:1px solid #294437;margin:18px 0}.demo-start{width:100%;margin-top:12px}.tag{white-space:nowrap}
@media(max-width:690px){.welcome{flex-direction:column;align-items:stretch;padding:18px}.welcome .btn.big{width:100%}.quick-panel .fields,.extras .fields{grid-template-columns:1fr}.quick-total{align-items:flex-start;flex-direction:column}.quick-total strong{font-size:24px}.btn.big{white-space:normal}.quick-panel .charttitle{align-items:flex-start}}

.debt-card{background:#112c1d;border:1px solid #345c41;border-radius:14px;margin-bottom:15px;padding:17px}
.debt-card>.charttitle{align-items:start;margin-bottom:15px}.debt-card strong{font-size:17px}
.debt-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.debt-stats>div{background:#0a1b12;border:1px solid #274b34;border-radius:10px;padding:10px;min-width:0}
.debt-stats small{font-size:11px;color:#b5cbbb;display:block;margin-bottom:6px}.debt-stats strong{font-size:17px;overflow-wrap:anywhere}
.debt-progress{background:#284131;height:8px;border-radius:7px;overflow:hidden;margin:13px 0}.debt-progress span{display:block;background:#5ee498;height:100%;border-radius:7px}
.debt-action{background:#0e2116;padding:14px;border:1px solid #355c43;border-radius:11px;margin:14px 0}
.debt-history{border-top:1px solid #2d4f39;padding-top:10px;margin-top:12px}.debt-history summary{cursor:pointer;color:#a9d6b8;font-size:13px}
.debt-highlight{padding:9px 0;border-bottom:1px solid #2b4d36;font-size:13px}.debt-highlight:last-child{border-bottom:0}
.checkbox-option{display:flex;align-items:center;gap:8px;color:#c9e5d4;font-size:13px}.checkbox-option input{width:18px;height:18px;flex:0 0 auto}.btn.small{font-size:12px;padding:6px 10px}
@media(max-width:850px){.debt-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:390px){.debt-card{padding:12px}.debt-stats{gap:6px}.debt-stats strong{font-size:15px}}
</style></head><body><div id="root"></div><script type="module" src="app.js"></script></body></html>
